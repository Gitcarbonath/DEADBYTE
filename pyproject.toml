[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "deadbyte"
version = "0.1.0"
description = "A local AI archaeologist for abandoned software"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "rich>=13.7", "pydantic>=2.7", "httpx>=0.27"]
[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]
[project.scripts]
deadbyte = "deadbyte.cli:app"
[tool.hatch.build.targets.wheel]
packages = ["src/deadbyte"]
[tool.pytest.ini_options]
pythonpath = ["src"]
